# coturn configuration for Telnet
# Docs: https://github.com/coturn/coturn/wiki/turnserver

# Listening ports
listening-port=3478
tls-listening-port=5349

# Your server's public IP — set this if running on a VPS
# external-ip=YOUR_PUBLIC_IP

# Realm (use your domain in production)
realm=localhost

# Shared secret — MUST match the value in the LiveKit config and NestJS .env
# Generate with: openssl rand -hex 32
static-auth-secret=telnet_turn_secret_change_me

# No logging noise
no-stdout-log
log-file=/var/log/coturn/turnserver.log
simple-log

# Security
no-loopback-peers
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# Allow local peers when developing on localhost (comment out above denied lines)
# or add: allowed-peer-ip=127.0.0.1

# Fingerprints
fingerprint
